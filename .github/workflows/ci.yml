name: CI - Build, Test & Sonar

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

# Si haces push seguido, cancela la ejecucion anterior de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permiso minimo para todo el workflow; cada job pide solo lo que necesita
permissions:
  contents: read

jobs:
  build-test-sonar:
    name: Build, Test & Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write   # necesario para que dorny/test-reporter publique el resultado
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jwt_tests
          POSTGRES_USER: jwt_tests
          POSTGRES_PASSWORD: jwt_tests_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jwt_tests -d jwt_tests"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout (historial completo para Sonar)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Una sola compilacion: tests + JaCoCo + JAR
      - name: Build, tests y cobertura
        run: mvn -B clean verify

      - name: Resultado de tests
        if: always()
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        with:
          name: Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Concurrencia JWT con PostgreSQL real
        run: >-
          mvn -B -Dtest=SesionPersistenciaTest
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/jwt_tests
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=jwt_tests
          -Dspring.datasource.password=jwt_tests_ci test

      - name: Guardar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Verificar que el JAR existe
        run: ls -la target/*.jar

      # Reutiliza target/ del paso anterior (no vuelve a compilar).
      # El token se lee de la variable SONAR_TOKEN, no se pasa por linea de comandos.
      # qualitygate.wait: el workflow falla si el Quality Gate no pasa.
      # El plan gratuito de SonarCloud solo analiza la rama principal y los pull requests,
      # asi que en push a develop o a un tag se omite (ese codigo ya paso el Quality Gate en su PR).
      - name: Analisis SonarCloud
        if: ${{ env.SONAR_TOKEN != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        run: mvn -B sonar:sonar -Dsonar.qualitygate.wait=true

  docker-build:
    name: Docker Image & Smoke Test
    runs-on: ubuntu-latest
    needs: build-test-sonar
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # necesario para publicar la imagen en GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build de la imagen
        run: >-
          docker build
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          -t bizagi2-backend:${{ github.sha }} .

      # Smoke test con PostgreSQL 17 y flujo completo de autenticacion
      - name: Smoke test con PostgreSQL y flujo Auth E2E
        run: |
          docker network create test-net
          docker run -d --name db --network test-net \
            -e POSTGRES_DB=bizagi2 -e POSTGRES_USER=bizagi -e POSTGRES_PASSWORD=test \
            postgres:17
          until docker exec db pg_isready -U bizagi -d bizagi2; do sleep 2; done
          sleep 5

          docker run -d --name app --network test-net -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL=jdbc:postgresql://db:5432/bizagi2 \
            -e DB_USER=bizagi \
            -e DB_PASSWORD=test \
            -e DDL_AUTO=validate \
            -e JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret-1234 \
            bizagi2-backend:${{ github.sha }}

          echo "Esperando que la aplicacion arranque..."
          READY=0
          for i in $(seq 1 40); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/swagger-ui.html | grep -q "200\|302"; then
              echo "La aplicacion arranco correctamente"
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "La aplicacion no arranco a tiempo"
            docker logs app
            docker logs db
            exit 1
          fi

          echo "=== 1. Registrar empresa y administrador (HU-01) ==="
          curl -s -c cookies.txt http://localhost:8080/api/auth/csrf > /dev/null
          CSRF=$(awk '$6 == "XSRF-TOKEN" {print $7}' cookies.txt)
          REG_RESP=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' -H "X-XSRF-TOKEN: $CSRF" -b cookies.txt -c cookies.txt \
            -d '{
              "nombreEmpresa": "Acme CI Corp",
              "nit": "900123456-1",
              "emailContacto": "contacto@acmeci.com",
              "nombre": "Admin CI",
              "email": "admin@acmeci.com",
              "password": "ClaveSegura123"
            }')
          REG_CODE=$(echo "$REG_RESP" | tail -n1)
          REG_BODY=$(echo "$REG_RESP" | sed '$d')
          echo "Status: $REG_CODE"
          echo "Body: $REG_BODY"
          if [ "$REG_CODE" != "201" ]; then
            echo "Fallo el registro en smoke test"
            docker logs app
            exit 1
          fi

          echo "=== 2. Iniciar sesion y obtener token JWT (HU-03) ==="
          LOGIN_RESP=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' -H "X-XSRF-TOKEN: $CSRF" -b cookies.txt -c cookies.txt \
            -d '{
              "email": "admin@acmeci.com",
              "password": "ClaveSegura123"
            }')
          LOGIN_CODE=$(echo "$LOGIN_RESP" | tail -n1)
          LOGIN_BODY=$(echo "$LOGIN_RESP" | sed '$d')
          echo "Status: $LOGIN_CODE"
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "Fallo login en smoke test"
            docker logs app
            exit 1
          fi

          TOKEN=$(echo "$LOGIN_BODY" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "No se obtuvo token valido"
            exit 1
          fi

          echo "=== 3. Consultar endpoint protegido con JWT ==="
          ME_RESP=$(curl -s -w "\n%{http_code}" -X GET http://localhost:8080/api/usuarios/me \
            -H "Authorization: Bearer $TOKEN")
          ME_CODE=$(echo "$ME_RESP" | tail -n1)
          ME_BODY=$(echo "$ME_RESP" | sed '$d')
          echo "Status: $ME_CODE"
          echo "Body: $ME_BODY"
          if [ "$ME_CODE" != "200" ]; then
            echo "Fallo endpoint protegido en smoke test"
            docker logs app
            exit 1
          fi

          echo "=== Smoke Test E2E completado con exito ==="
          python3 scripts/jwt_smoke.py --base-url http://localhost:8080/api

      # Solo se publica la imagen que ya paso tests y smoke test. Los pull requests no publican.
      #   develop        -> :develop  (staging)
      #   master / main  -> :latest
      #   tag vX.Y.Z     -> :X.Y.Z    (produccion)
      # Ademas siempre :sha-<commit>, para poder volver a una version exacta.
      - name: Publicar imagen en GHCR
        if: github.event_name == 'push'
        env:
          IMAGEN: ghcr.io/jhony-hacku/bizagi2-backend
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          TAGS="sha-${GITHUB_SHA::7}"
          case "$GITHUB_REF" in
            refs/heads/develop)                TAGS="$TAGS develop" ;;
            refs/heads/master|refs/heads/main) TAGS="$TAGS latest" ;;
            refs/tags/v*)                      TAGS="$TAGS ${GITHUB_REF_NAME#v}" ;;
          esac
          for TAG in $TAGS; do
            docker tag "bizagi2-backend:${GITHUB_SHA}" "$IMAGEN:$TAG"
            docker push "$IMAGEN:$TAG"
          done

  # Solo en push a develop, y solo si la imagen paso tests y smoke test y ya se publico.
  # El runner entra a la red de Tailscale como nodo efimero con tag:ci, que unicamente
  # alcanza el SSH (22) y el HTTPS (443) de los contenedores tag:deploy.
  deploy-staging:
    name: Deploy a staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    timeout-minutes: 20
    environment: staging
    # Los despliegues a staging no se pisan entre si: el siguiente espera al anterior
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Checkout (para copiar el compose)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Conectar a Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Preparar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # tr quita los retornos de carro por si el secreto se pego desde Windows
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$STAGING_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

          # Direccion del servidor dentro de Tailscale (no depende del DNS del runner)
          IP=$(tailscale ip -4 bizagi2-staging)
          FQDN=$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "bizagi2-staging") | .DNSName' | sed 's/\.$//')
          if [ -z "$IP" ] || [ -z "$FQDN" ]; then
            echo "No se encontro bizagi2-staging en la red de Tailscale"
            tailscale status
            exit 1
          fi
          echo "STAGING_IP=$IP" >> "$GITHUB_ENV"
          echo "STAGING_FQDN=$FQDN" >> "$GITHUB_ENV"

          # HostKeyAlias: la huella guardada esta a nombre de "bizagi2-staging"
          {
            echo "Host staging"
            echo "  HostName $IP"
            echo "  User deploy"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  HostKeyAlias bizagi2-staging"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      # Descarga solo la imagen nueva y recrea lo que cambio. --wait espera a que todo quede "healthy"
      - name: Desplegar
        run: |
          scp deploy/compose.yml staging:/opt/bizagi2/compose.yml
          ssh staging 'cd /opt/bizagi2 && docker compose pull backend && docker compose up -d --wait --wait-timeout 420 && docker image prune -f && docker compose ps'

      # Comprueba la app de punta a punta, por el mismo HTTPS que usan las personas
      - name: Verificar que staging responde
        run: |
          URL="https://$STAGING_FQDN"
          for i in $(seq 1 24); do
            SALUD=$(curl -s -o /dev/null -w '%{http_code}' --resolve "$STAGING_FQDN:443:$STAGING_IP" "$URL/healthz" || true)
            API=$(curl -s -o /dev/null -w '%{http_code}' --resolve "$STAGING_FQDN:443:$STAGING_IP" "$URL/api/auth/csrf" || true)
            if [ "$SALUD" = "200" ] && [ "$API" = "204" ]; then
              echo "Staging responde: front $SALUD, backend $API"
              exit 0
            fi
            echo "Intento $i: front $SALUD, backend $API"
            sleep 5
          done
          echo "Staging no respondio a tiempo"
          ssh staging 'cd /opt/bizagi2 && docker compose ps && docker compose logs --tail 40 backend'
          exit 1

  # Pruebas de extremo a extremo: un Chrome real recorre la app recien desplegada en staging.
  # Solo corre si el despliegue a staging termino bien (si este se omite, este tambien).
  e2e-staging:
    name: Selenium contra staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Conectar a Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Chrome necesita resolver el nombre de staging: se fija en /etc/hosts con su IP de Tailscale
      - name: Localizar staging
        run: |
          IP=$(tailscale ip -4 bizagi2-staging)
          FQDN=$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "bizagi2-staging") | .DNSName' | sed 's/\.$//')
          if [ -z "$IP" ] || [ -z "$FQDN" ]; then
            echo "No se encontro bizagi2-staging en la red de Tailscale"
            tailscale status
            exit 1
          fi
          echo "$IP $FQDN" | sudo tee -a /etc/hosts > /dev/null
          echo "STAGING_URL=https://$FQDN" >> "$GITHUB_ENV"

      - name: Pruebas E2E con Selenium
        run: mvn -B -f e2e/pom.xml test -De2e.baseUrl="$STAGING_URL"

      # La tabla de resultados queda visible en la pagina de la ejecucion, sin descargar nada
      - name: Publicar resumen de las pruebas
        if: always()
        run: |
          if [ -f e2e/target/evidencias/resumen.md ]; then
            cat e2e/target/evidencias/resumen.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Reporte HTML con la captura final de cada prueba (pase o falle) y los reportes de Maven
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-evidencias
          path: |
            e2e/target/evidencias/
            e2e/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  # Produccion: solo al publicar una version (tag vX.Y.Z), con la imagen exacta de esa version,
  # y solo despues de que un revisor apruebe el despliegue en el entorno "production".
  deploy-production:
    name: Deploy a produccion
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout (para copiar el compose)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Conectar a Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Llave y huella propias de produccion: son secretos del entorno, no del repositorio
      - name: Preparar SSH
        env:
          PROD_DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$PROD_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

          IP=$(tailscale ip -4 bizagi2-prod)
          FQDN=$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "bizagi2-prod") | .DNSName' | sed 's/\.$//')
          if [ -z "$IP" ] || [ -z "$FQDN" ]; then
            echo "No se encontro bizagi2-prod en la red de Tailscale"
            tailscale status
            exit 1
          fi
          echo "PROD_IP=$IP" >> "$GITHUB_ENV"
          echo "PROD_FQDN=$FQDN" >> "$GITHUB_ENV"

          {
            echo "Host prod"
            echo "  HostName $IP"
            echo "  User deploy"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  HostKeyAlias bizagi2-prod"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      # Fija la version en el .env del servidor y recrea solo este servicio.
      # Para volver atras basta con volver a ejecutar el workflow del tag anterior.
      - name: Desplegar version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *[!0-9A-Za-z._-]*|"") echo "Version no valida: $VERSION"; exit 1 ;;
          esac
          echo "Desplegando backend $VERSION"
          scp deploy/compose.yml prod:/opt/bizagi2/compose.yml
          ssh prod "cd /opt/bizagi2 && sed -i 's/^BACKEND_TAG=.*/BACKEND_TAG=$VERSION/' .env && docker compose pull backend && docker compose up -d --wait --wait-timeout 420 db backend && docker image prune -f && docker compose ps"

      # La base de datos y el backend ya quedaron "healthy" (--wait). El recorrido completo
      # por HTTPS lo comprueba el despliegue del front, que es quien publica la aplicacion.