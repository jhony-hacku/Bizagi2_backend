services:
  db:
    image: postgres:17-alpine
    container_name: bizagi2-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bizagi2}
      POSTGRES_USER: ${POSTGRES_USER:-bizagi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizagi_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizagi2-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bizagi2}
      DB_USER: ${POSTGRES_USER:-bizagi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bizagi_dev_password}
      DDL_AUTO: ${DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-32-characters}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      # En compose se usa http://localhost, por eso la cookie no es Secure. En produccion real: true
      JWT_REFRESH_COOKIE_SECURE: ${JWT_REFRESH_COOKIE_SECURE:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data: