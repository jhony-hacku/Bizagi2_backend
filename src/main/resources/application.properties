spring.application.name=Bizagi2

# Las credenciales se leen del archivo .env (ver .env.example)
spring.datasource.url=jdbc:postgresql://localhost:5432/bizagi2
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
# Access token corto (15 min) y refresh token largo (7 dias)
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
# Cookie del refresh token: solo por HTTPS. Poner false unicamente en desarrollo local con http
jwt.refresh-cookie-secure=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# No usamos el usuario en memoria que crea Spring Security: la autenticacion es con JWT
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
