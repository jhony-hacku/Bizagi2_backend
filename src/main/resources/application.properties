spring.application.name=Bizagi2

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bizagi2}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:javeriana}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:change-this-secret-with-at-least-32-characters}
jwt.expiration-ms=${JWT_EXPIRATION:3600000}

springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs