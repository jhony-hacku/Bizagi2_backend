# ==============================================================================
# PERFIL DEV (H2 en memoria para desarrollo local sin PostgreSQL)
# Para activar en IntelliJ: añadir en VM options: -Dspring.profiles.active=dev
# O en Program arguments: --spring.profiles.active=dev
# ==============================================================================

spring.datasource.url=jdbc:h2:mem:bizagi2;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Consola H2 para consultar tablas desde el navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=dev-secret-key-for-local-testing-at-least-32-characters
jwt.expiration-ms=3600000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
