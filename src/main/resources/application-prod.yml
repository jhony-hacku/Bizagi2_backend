# ==============================================================================
# PERFIL PROD (Producción / Contenedores Docker / Kubernetes)
# Lee todas las credenciales y parámetros de conexión desde variables de entorno.
# ==============================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Por defecto 'validate' para máxima seguridad en producción (falla si el esquema no coincide).
      # En CI / smoke tests se sobreescribe con DDL_AUTO=update.
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
  h2:
    console:
      enabled: false

# Configuración JWT: access token corto (15 min) y refresh token largo (7 días)
jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  # true por defecto (HTTPS). Solo ponerlo en false si se prueba en http local, p. ej. docker compose
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}

# Documentación OpenAPI / Swagger en producción
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
